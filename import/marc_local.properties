###############################################################################
# marc_local.properties -- local overrides to standard VuFind MARC mappings.  #
#                          All settings in this file override equivalent      #
#                          settings in marc.properties.                       #
###############################################################################

id = custom, prefixRemove(900a), first
building = custom(org.vufind.index.LocationTools), getBuildings, branch_map.properties
format = custom(org.vufind.index.FormatTools), getFormat, format_map.properties
fullrecord = FullRecordAsMarc

###collection_browse = custom(org.vufind.index.CollectionTools), getCollection, collection_map.properties
# Automated Index Datestamps (Replaces solrIndexDate.bsh)
# Leverages core db history tracking methods natively inside the SolrMarc runtime
###first_indexed = custom(Base), getFirstIndexed(900a)
###last_indexed = custom(Base), getLastIndexed(900a)

# Dewey Classification Fields
# Formatted to leverage pre-compiled organization matrices

###dewey-hundreds = custom(Dewey), getDeweyNumber(092a, 100), ddc22_map.properties(hundreds)
###dewey-tens     = custom(Dewey), getDeweyNumber(092a, 10), ddc22_map.properties(tens)
###dewey-ones     = custom(Dewey), getDeweyNumber(092a, 1), ddc22_map.properties(ones)
###dewey-full     = custom(Dewey), getDeweySearchable(092a:099a:086a:950a)
###dewey-sort     = custom(Dewey), getDeweySortable(092a:099a:086a:950a)

# Clean Catalog Headings (Replaces removeSlash.bsh)
# Uses native strip modifiers to drop trailing slashes, spaces, and formatting marks cleanly
###title       = 245ab, removeTrailingPunctuation
###title_sub   = 245b, removeTrailingPunctuation
###title_short = 245a, removeTrailingPunctuation
###title_auth  = 245ab, removeTrailingPunctuation

# Internationalization Map Linking
###language = 008[35-37]:041a:041d:041j, map(language_map.properties)

# Library Sorting & Shelfkey Generation (Replaces callnumber.bsh)
# Leverages native uppercase manipulation routines and standard string mapping formats
###callnumber = 092:099:086:950:090:050:060:070:091:093:094:095:096:097:098, custom(Util), toUpperCase

# Item Age Trackers (Replaces getdate.bsh)
# Safely parses chronological details natively using normalized system formatting
###date_created  = 980a, custom(Date), getFormattedDate
###date_modified = 980b, custom(Date), getFormattedDate