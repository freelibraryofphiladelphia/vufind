services:
  web:
    build: .
    ports:
      - "80:80"
    volumes:
      - vufind_source:/var/www/vufind
    environment:
      - VUFIND_HOME=/var/www/vufind
      - VUFIND_LOCAL_DIR=/var/www/vufind/local
    depends_on:
      - mysql
      - solr

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: vufind
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"

  solr:
    image: solr:8
    ports:
      - "8080:8983"
    volumes:
      - solr_data:/var/solr
      - vufind_source:/var/www/vufind

  import:
    image: solr:8
    volumes:
      - vufind_source:/var/www/vufind
    environment:
      - VUFIND_HOME=/var/www/vufind
      - VUFIND_LOCAL_DIR=/var/www/vufind/local
      - SOLRCORE=biblio
    depends_on:
      - solr
    command: sh -c "while [ ! -f /var/www/vufind/import-marc.sh ]; do sleep 2; done && /var/www/vufind/import-marc.sh /var/www/vufind/biblio.mrc"

volumes:
  vufind_source:
  mysql_data:
  solr_data:
