server {
    listen 80;
    server_name localhost;
    root /var/www/vufind/public; # by default we look in public
    index index.php;

    # Theme-specific resources
    location ~ ^/themes/([0-9a-zA-Z-_]*)/(?:assets|css|images|js)/(.*)$ {
        root /var/www/vufind; # but if it says themes, we need to adjust up to vufind so theme is available
        try_files $uri =404;
    }

    # Public cache for asset pipeline
    location ~ ^/cache/(.*)$ {
        root /var/www/vufind/local/cache/public; # and the cache is in local/cache/public, so we move there as needed
        try_files $uri =404;
    }

    # Development mode (uncomment if needed)
    #fastcgi_param VUFIND_ENV development;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        
        fastcgi_param VUFIND_HOME /var/www/vufind;
        fastcgi_param VUFIND_LOCAL_DIR /var/www/vufind/local;
        # Pass Authorization header for OAuth2/OpenID Connect
        fastcgi_param HTTP_AUTHORIZATION $http_authorization if_not_empty;
    }
}
